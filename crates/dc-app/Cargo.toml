[package]
name = "dc-app"
description = "DiagramCraft, an open-source diagramming editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "diagramcraft"
path = "src/main.rs"

[dependencies]
dc-model = { workspace = true }
dc-lucid = { workspace = true }
dc-vsdx = { workspace = true }
dc-geom = { workspace = true }
dc-render = { workspace = true }
dc-export = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
parley = "0.12"
vello = "0.11"
wgpu = "30"
winit = "0.30"
pollster = "0.4"
env_logger = "0.11"
log = { workspace = true }
thiserror = { workspace = true }
rfd = "0.15"
png = "0.18"
arboard = { version = "3.7", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }

# The menu bar belongs to the system on macOS, so the commands go into the
# real NSMenu rather than a row drawn inside the window. Other platforms keep
# the in-window menu bar, which is why this is not a workspace dependency.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19", default-features = false }
# macOS has no per-window icon, so the dock icon is set on the application
# itself. These are already in the tree by way of winit.
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.2", features = ["NSData"] }
objc2 = "0.5"

[dev-dependencies]
tempfile = "3"
zip = { workspace = true }
